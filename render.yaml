services:
  - type: web
    name: wa-broadcast-bot
    runtime: node
    region: singapore
    plan: free
    rootDir: artifacts/wa-bot
    buildCommand: npm install
    startCommand: node index.js
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: OWNER_ID
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: SELF_URL
        fromService:
          type: web
          name: wa-broadcast-bot
          property: host
    healthCheckPath: /health
